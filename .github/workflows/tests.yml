name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/training.txt
            requirements/autodl-cu124.txt
      - name: Install CPU training dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/training.txt
          python -m pip check
      - name: Verify CLI and offline fixtures
        run: |
          python scripts/cpv.py --help
          python scripts/cpv.py train env --device cpu
          python -m unittest discover -s tests -v
