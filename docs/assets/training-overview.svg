<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title description">
  <title id="title">Jev 客服规则合规判别：模型训练架构</title>
  <desc id="description">业务规则、对话历史和待审回复经归一化后组成 Jev 提示，输入 Qwen3-0.6B。读取提示末位置的原生 A/B logits，计算两项 softmax 与真实标签监督下的受限交叉熵。通过 LLaMA-Factory 反向传播更新全部模型参数，并完成检查点恢复、验证选模、独立重载和标准模型导出。真实标签不进入模型提示。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafcfb"/>
      <stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <linearGradient id="model-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef8f5"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="engine-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef4f8"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#203b4b" flood-opacity="0.045"/>
    </filter>
    <marker id="forward-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#7a8c9c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="gradient-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#387d77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #172d3c; }
      .kicker { font-size: 12px; font-weight: 650; letter-spacing: 2.2px; fill: #6d8391; }
      .title { font-size: 38px; font-weight: 700; letter-spacing: -0.7px; }
      .subtitle { font-size: 18px; fill: #667d8b; }
      .step { font-size: 13px; font-weight: 700; fill: #647d8d; }
      .heading { font-size: 22px; font-weight: 650; letter-spacing: -0.3px; }
      .label { font-size: 18px; font-weight: 600; }
      .body { font-size: 16px; fill: #536c7c; }
      .small { font-size: 14px; fill: #667e8d; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 15px; fill: #547080; }
      .green { fill: #276c65; }
      .card { fill: #ffffff; stroke: #e0e8ed; stroke-width: 1.2; filter: url(#shadow); }
      .forward { fill: none; stroke: #7a8c9c; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#forward-arrow); }
    </style>
  </defs>

  <rect width="1600" height="880" rx="28" fill="url(#background)"/>
  <text x="48" y="41" class="kicker">MODEL TRAINING OVERVIEW</text>
  <text x="48" y="94" class="title">Jev 客服规则合规判别</text>
  <text x="49" y="134" class="subtitle">从业务证据到 A/B 受限监督的全参数训练</text>
  <rect x="1210" y="54" width="342" height="48" rx="24" fill="#e8f3ee" stroke="#d8e8e0"/>
  <circle cx="1234" cy="78" r="4" fill="#45897d"/>
  <text x="1250" y="84" font-size="16" font-weight="600" class="green">Qwen3-0.6B · 全参数微调</text>
  <path d="M 1261 135 H 1292" class="forward"/>
  <text x="1303" y="141" class="small">前向</text>
  <path d="M 1391 135 H 1422" fill="none" stroke="#387d77" stroke-width="1.8" stroke-dasharray="5 5"/>
  <text x="1433" y="141" class="small">反向更新</text>

  <!-- 01: Only business evidence enters the prompt. -->
  <rect x="48" y="196" width="294" height="388" rx="18" class="card"/>
  <rect x="72" y="217" width="30" height="30" rx="9" fill="#eef3f7"/>
  <text x="87" y="237" text-anchor="middle" class="step">01</text>
  <text x="116" y="239" class="heading">业务证据</text>
  <path d="M 72 260 H 318" stroke="#edf1f4"/>
  <rect x="72" y="281" width="246" height="62" rx="10" fill="#f7f9fb"/>
  <path d="M 86 299 V 325" stroke="#a1b3c2" stroke-width="3" stroke-linecap="round"/>
  <text x="102" y="307" class="label">业务规则</text>
  <text x="102" y="330" class="mono">policy</text>
  <rect x="72" y="357" width="246" height="62" rx="10" fill="#f7f9fb"/>
  <path d="M 86 375 V 401" stroke="#a1b3c2" stroke-width="3" stroke-linecap="round"/>
  <text x="102" y="383" class="label">对话历史</text>
  <text x="102" y="406" class="mono">conversation</text>
  <rect x="72" y="433" width="246" height="62" rx="10" fill="#f7f9fb"/>
  <path d="M 86 451 V 477" stroke="#a1b3c2" stroke-width="3" stroke-linecap="round"/>
  <text x="102" y="459" class="label">待审核回复</text>
  <text x="102" y="482" class="mono">candidate_response</text>
  <rect x="72" y="526" width="246" height="34" rx="17" fill="#eef3f7"/>
  <text x="195" y="548" text-anchor="middle" font-size="14" font-weight="600" fill="#5a7485">7,227 条混合训练样本</text>

  <path d="M 349 390 H 383" class="forward"/>

  <!-- 02: Jev prompt construction uses the native non-thinking chat template. -->
  <rect x="390" y="196" width="294" height="388" rx="18" class="card"/>
  <rect x="414" y="217" width="30" height="30" rx="9" fill="#eef3f7"/>
  <text x="429" y="237" text-anchor="middle" class="step">02</text>
  <text x="458" y="239" class="heading">Jev 提示构建</text>
  <path d="M 414 260 H 660" stroke="#edf1f4"/>
  <rect x="414" y="281" width="246" height="214" rx="12" fill="#f7f9fb" stroke="#e8eef2"/>
  <circle cx="434" cy="304" r="3" fill="#a7b8c5"/>
  <circle cx="446" cy="304" r="3" fill="#a7b8c5"/>
  <circle cx="458" cy="304" r="3" fill="#a7b8c5"/>
  <text x="537" y="344" text-anchor="middle" class="label">统一输入归一化</text>
  <text x="537" y="376" text-anchor="middle" class="body">业务证据 + 判断标准</text>
  <rect x="432" y="397" width="210" height="35" rx="8" fill="#eaf0f5"/>
  <text x="537" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#5f7989">A 合规 · B 违规</text>
  <text x="537" y="464" text-anchor="middle" class="small">非思考 chat template</text>
  <rect x="414" y="526" width="246" height="34" rx="17" fill="#eef3f7"/>
  <text x="537" y="548" text-anchor="middle" font-size="14" font-weight="600" fill="#5a7485">提示结束于 assistant 回答起点</text>

  <path d="M 691 390 H 725" class="forward"/>

  <!-- 03: The pretrained backbone and its native vocabulary head are both trained. -->
  <rect x="732" y="196" width="318" height="388" rx="18" fill="url(#model-fill)" stroke="#c8ded6" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="756" y="217" width="30" height="30" rx="9" fill="#dcefe7"/>
  <text x="771" y="237" text-anchor="middle" class="step green">03</text>
  <text x="800" y="239" class="heading green">Qwen3-0.6B</text>
  <path d="M 756 260 H 1026" stroke="#dceae4"/>
  <rect x="768" y="287" width="246" height="80" rx="11" fill="#dcece4"/>
  <rect x="762" y="295" width="258" height="80" rx="11" fill="#e6f2ec" stroke="#d0e3d8"/>
  <rect x="756" y="303" width="270" height="80" rx="11" fill="#f5faf7" stroke="#c4dbce"/>
  <text x="891" y="338" text-anchor="middle" font-size="21" font-weight="600" class="green">Transformer</text>
  <text x="891" y="364" text-anchor="middle" class="small">预训练骨干</text>
  <path d="M 891 385 V 405" class="forward"/>
  <rect x="756" y="414" width="270" height="61" rx="11" fill="#ffffff" stroke="#cddfd5"/>
  <text x="891" y="451" text-anchor="middle" class="label green">原生词表输出头</text>
  <text x="891" y="504" text-anchor="middle" class="small">读取提示末位置 logits</text>
  <rect x="756" y="526" width="270" height="34" rx="17" fill="#e1f0e7"/>
  <text x="891" y="548" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" class="green">FULL PARAMETER FINETUNING</text>

  <path d="M 1057 390 H 1091" class="forward"/>

  <!-- 04: Gold labels supervise only the restricted A/B loss. -->
  <rect x="1098" y="196" width="454" height="388" rx="18" class="card"/>
  <rect x="1122" y="217" width="30" height="30" rx="9" fill="#eef3f7"/>
  <text x="1137" y="237" text-anchor="middle" class="step">04</text>
  <text x="1166" y="239" class="heading">A/B 受限监督</text>
  <path d="M 1122 260 H 1528" stroke="#edf1f4"/>
  <rect x="1122" y="281" width="406" height="44" rx="10" fill="#edf6f1"/>
  <rect x="1133" y="289" width="28" height="28" rx="8" fill="#d5e9df"/>
  <text x="1147" y="309" text-anchor="middle" font-size="15" font-weight="700" class="green">A</text>
  <text x="1174" y="309" font-size="17" font-weight="600" class="green">compliant · 合规</text>
  <text x="1507" y="309" text-anchor="end" class="mono">z_A</text>
  <rect x="1122" y="337" width="406" height="44" rx="10" fill="#f7f1e9"/>
  <rect x="1133" y="345" width="28" height="28" rx="8" fill="#eadcc9"/>
  <text x="1147" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#8c6d4c">B</text>
  <text x="1174" y="365" font-size="17" font-weight="600" fill="#80684f">violating · 违规</text>
  <text x="1507" y="365" text-anchor="end" class="mono">z_B</text>
  <text x="1123" y="404" class="small">仅取原生词表中的 A/B 两项</text>
  <rect x="1122" y="419" width="232" height="44" rx="10" fill="#f1f5f8" stroke="#e5edf1"/>
  <text x="1238" y="447" text-anchor="middle" class="mono">P = softmax(z_A, z_B)</text>
  <rect x="1370" y="419" width="158" height="37" rx="18.5" fill="#f6f0e6" stroke="#e7dcc9"/>
  <text x="1449" y="443" text-anchor="middle" font-size="15" font-weight="600" fill="#8a7456">真实标签 y</text>
  <path d="M 1238 465 V 485" class="forward"/>
  <path d="M 1449 458 V 485" class="forward"/>
  <rect x="1122" y="490" width="406" height="70" rx="11" fill="#eaf3ef" stroke="#d1e3da"/>
  <text x="1140" y="520" font-size="18" font-weight="650" class="green">受限交叉熵</text>
  <text x="1507" y="520" text-anchor="end" class="mono green">L = −log P(y)</text>
  <text x="1140" y="546" class="small">仅在 A/B 两项之间计算监督损失</text>

  <!-- Backpropagation updates the complete Qwen model through the native readout. -->
  <path d="M 1325 561 V 615 Q 1325 632 1308 632 H 908 Q 891 632 891 615 V 587" fill="none" stroke="#387d77" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" marker-end="url(#gradient-arrow)"/>
  <rect x="929" y="614" width="358" height="36" rx="18" fill="#eef5f2" stroke="#d9e8e0"/>
  <text x="1108" y="638" text-anchor="middle" font-size="16" font-weight="600" class="green">反向传播 · 更新全部模型参数</text>

  <!-- The framework owns the training lifecycle; project adapters specialize it. -->
  <rect x="48" y="700" width="1504" height="132" rx="18" fill="url(#engine-fill)" stroke="#dce5ed"/>
  <text x="76" y="732" class="kicker">TRAINING ENGINE</text>
  <text x="76" y="768" font-size="26" font-weight="650">LLaMA-Factory</text>
  <text x="77" y="796" class="small">自定义 Trainer · 全参数训练</text>
  <path d="M 414 726 V 807 M 786 726 V 807 M 1158 726 V 807" stroke="#dce5ed"/>
  <text x="446" y="752" class="label">损失与评测扩展</text>
  <text x="446" y="782" class="mono">compute_loss / prediction_step</text>
  <text x="818" y="752" class="label">检查点与模型选择</text>
  <text x="818" y="782" class="small">可恢复训练 · 验证集交叉熵</text>
  <text x="1190" y="752" class="label">重载验证与模型导出</text>
  <text x="1190" y="782" class="small">标准 Qwen 格式 · tokenizer</text>
</svg>
