<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="550" viewBox="0 0 1260 550" fill="#262a32" role="img" aria-labelledby="title description">
  <title id="title">Jev classifier: Qwen backbone and A/B readout</title>
  <desc id="description">Policy, dialogue history, and a candidate reply form a non-thinking prompt. Native token embeddings feed the 28 decoder layers of Qwen3-0.6B; only Attention and FFN are shown inside the decoder. The final prompt token state passes through the native language-model head to produce vocabulary scores. A/B scores are selected and normalized into compliant or violating probabilities. LLaMA-Factory trains all model parameters with cross-entropy restricted to A/B. Silver denotes reused model components; blue denotes task readout and supervision.</desc>
  <defs>
    <linearGradient id="pearl" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/><stop offset="0.55" stop-color="#f0f2f7"/><stop offset="1" stop-color="#e4e8f0"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafbfe"/><stop offset="1" stop-color="#e9edf5"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#75b0ff"/><stop offset="1" stop-color="#2672e3"/>
    </linearGradient>
    <linearGradient id="blue-tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f8ff"/><stop offset="1" stop-color="#e4efff"/>
    </linearGradient>
    <filter id="model-shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#35425b" flood-opacity="0.10"/>
    </filter>
    <filter id="soft-shadow" x="-25%" y="-35%" width="150%" height="185%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#35425b" flood-opacity="0.07"/>
    </filter>
    <filter id="blue-shadow" x="-45%" y="-30%" width="190%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2672e3" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 2 L6 5 L2 8" fill="none" stroke="#aab3c2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 2 L6 5 L2 8" fill="none" stroke="#6d9edc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif; font-optical-sizing:auto; font-kerning:normal; text-rendering:optimizeLegibility; }
      .model-name { font-family:ui-rounded, 'SF Pro Rounded', -apple-system, 'Helvetica Neue', sans-serif; font-size:32px; font-weight:600; letter-spacing:-0.65px; fill:#1d1d1f; }
      .module { font-family:'SF Pro Display', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif; font-size:22px; font-weight:500; letter-spacing:-0.35px; fill:#333945; }
      .input-label { font-family:'SF Pro Text', -apple-system, 'Helvetica Neue', sans-serif; font-size:18.5px; font-weight:500; letter-spacing:-0.1px; fill:#495263; }
      .layer-label { font-size:18px; font-weight:500; letter-spacing:-0.15px; fill:#596476; }
      .secondary { fill:#778193; font-size:17px; font-weight:400; letter-spacing:-0.15px; }
      .model-detail { font-size:16px; letter-spacing:0.05px; }
      .accent { font-family:'SF Pro Text', -apple-system, 'Helvetica Neue', sans-serif; fill:#2472d5; font-size:18.5px; font-weight:500; letter-spacing:-0.15px; }
      .option-letter { font-family:ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif; font-size:22px; font-weight:600; fill:#fff; }
      .option-label { font-family:'SF Pro Text', -apple-system, 'Helvetica Neue', sans-serif; font-size:20px; font-weight:500; letter-spacing:-0.2px; fill:#252c37; }
      .training-label { font-size:22px; font-weight:500; letter-spacing:-0.2px; fill:#333945; }
      .flow { fill:none; stroke:#aab3c2; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-gray); }
      .readout { fill:none; stroke:#6d9edc; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
      .icon { fill:none; stroke:#8792a4; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>
  <rect width="1260" height="550" fill="#fff"/>
  <g transform="translate(0 -70)">

  <!-- Business evidence becomes one non-thinking prompt. -->
  <g>
    <rect x="76" y="379" width="208" height="46" rx="23" fill="#f5f6f8"/>
    <rect x="76" y="434" width="208" height="46" rx="23" fill="#f5f6f8"/>
    <rect x="76" y="489" width="208" height="46" rx="23" fill="#f5f6f8"/>
    <g class="icon">
      <rect x="101" y="391" width="17" height="22" rx="3"/>
      <path d="M106 397 H113 M106 402 H113 M106 407 H111"/>
      <path d="M101 447 H119 V460 H108 L102 465 V460 H101 Z"/>
      <path d="M103 503 H120 V516 H113 L118 521 V516 H103 Z"/>
      <path d="M108 508 H115 M108 512 H113"/>
    </g>
    <text x="136" y="409" class="input-label">Policy</text>
    <text x="136" y="464" class="input-label">Dialogue</text>
    <text x="136" y="519" class="input-label">Candidate reply</text>
    <text x="180" y="566" text-anchor="middle" class="secondary">Non-thinking prompt</text>
  </g>
  <path d="M298 457 C320 457 315 540 330 540" class="flow"/>

  <!-- Original embedding, decoder layers and LM head share a silver material. -->
  <g filter="url(#soft-shadow)">
    <rect x="345" y="510" width="310" height="60" rx="30" fill="url(#head)"/>
    <rect x="345.5" y="510.5" width="309" height="59" rx="29.5" fill="none" stroke="#fff" stroke-opacity="0.9"/>
  </g>
  <text x="500" y="547" text-anchor="middle" class="module">Token Embedding</text>
  <path d="M500 501 V488" class="flow"/>

  <rect x="367" y="303" width="266" height="178" rx="42" fill="#e6eaf1"/>
  <rect x="356" y="291" width="288" height="178" rx="42" fill="#dce2ec"/>
  <g filter="url(#model-shadow)">
    <rect x="345" y="279" width="310" height="178" rx="42" fill="url(#pearl)"/>
    <rect x="345.5" y="279.5" width="309" height="177" rx="41.5" fill="none" stroke="#fff" stroke-opacity="0.95"/>
  </g>
  <text x="500" y="321" text-anchor="middle" class="model-name">Qwen3-0.6B</text>
  <text x="500" y="349" text-anchor="middle" class="secondary model-detail">Decoder × 28</text>
  <rect x="381" y="368" width="238" height="29" rx="14.5" fill="#fff" fill-opacity="0.68"/>
  <rect x="381" y="409" width="238" height="29" rx="14.5" fill="#fff" fill-opacity="0.68"/>
  <text x="500" y="388" text-anchor="middle" class="layer-label">Attention</text>
  <text x="500" y="429" text-anchor="middle" class="layer-label">FFN</text>
  <path d="M500 269 V256" class="flow"/>

  <!-- Only the final prompt state is read out. -->
  <rect x="383" y="195" width="27" height="52" rx="13.5" fill="#edf0f5"/>
  <rect x="427" y="195" width="27" height="52" rx="13.5" fill="#e7ebf2"/>
  <rect x="471" y="195" width="27" height="52" rx="13.5" fill="#e1e6ef"/>
  <rect x="515" y="195" width="27" height="52" rx="13.5" fill="#d9e1ed"/>
  <rect x="559" y="190" width="32" height="62" rx="16" fill="url(#blue)" filter="url(#blue-shadow)"/>
  <text x="575" y="160" text-anchor="middle" class="accent">Last-token state</text>
  <path d="M612 221 H710" class="readout" marker-end="url(#arrow-blue)"/>

  <g filter="url(#soft-shadow)">
    <rect x="733" y="190" width="186" height="62" rx="31" fill="url(#head)"/>
    <rect x="733.5" y="190.5" width="185" height="61" rx="30.5" fill="none" stroke="#fff" stroke-opacity="0.9"/>
  </g>
  <text x="826" y="228" text-anchor="middle" class="module">Native LM head</text>

  <!-- Selection and normalization are a readout, not an added trainable head. -->
  <text x="1108" y="160" text-anchor="middle" class="accent">Select A/B</text>
  <path d="M937 221 C971 221 972 210 1000 210 M937 221 C971 221 972 292 1000 292" class="readout"/>
  <g filter="url(#soft-shadow)">
    <rect x="1020" y="177" width="177" height="66" rx="33" fill="url(#blue-tint)"/>
    <rect x="1020" y="259" width="177" height="66" rx="33" fill="url(#blue-tint)"/>
  </g>
  <circle cx="1055" cy="210" r="23" fill="url(#blue)"/>
  <circle cx="1055" cy="292" r="23" fill="url(#blue)"/>
  <text x="1055" y="217" text-anchor="middle" class="option-letter">A</text>
  <text x="1055" y="299" text-anchor="middle" class="option-letter">B</text>
  <text x="1135" y="218" text-anchor="middle" class="option-label">Compliant</text>
  <text x="1135" y="300" text-anchor="middle" class="option-label">Violating</text>
  <text x="1108" y="358" text-anchor="middle" class="accent">Normalize A/B</text>

  <!-- Training stays a short annotation, without a second wiring network. -->
  <g transform="translate(813 485)">
    <circle cx="20" cy="20" r="20" fill="#edf4ff"/>
    <rect x="11" y="14" width="6" height="15" rx="3" fill="#6f9de0"/>
    <rect x="23" y="9" width="6" height="20" rx="3" fill="#3078de"/>
    <text x="57" y="18" class="training-label">A/B-only cross-entropy</text>
    <text x="57" y="47" class="secondary">All parameters · LLaMA-Factory</text>
  </g>
  </g>
</svg>
